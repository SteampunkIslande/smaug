[package]
name = "smaug"
version = "0.11.0"
edition = "2024"

default-run = "smaug"

[workspace]
members = ["smaug-lib"]


[dependencies]
smaug-lib = { path = "./smaug-lib" }
rocket = { version = "0.5", features = ["secrets", "json"] }
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "time",
] }
bcrypt = "0.15"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
log = "0.4.28"
env_logger = "0.11.8"
regex = "1.12.2"
anyhow = "1.0.104"
nix = { version = "0.31.3", features = ["signal"] }
rocket-include-dir = "1.1.2"
include_dir = "0.7.4"
time = { version = "0.3.55", features = [
    "serde",
    "parsing",
    "formatting",
    "local-offset",
] }
wherror = "2.4.0"

[dev-dependencies]
rocket = { version = "0.5", features = ["secrets", "json"] }
